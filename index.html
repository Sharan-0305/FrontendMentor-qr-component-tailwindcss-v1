<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"rel="stylesheet">
    <title>Frontend Mentor | QR code component</title>
    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
        .attribution {
            font-size: 11px;
            text-align: center;
        }
        .attribution a {
            color: hsl(228, 45%, 44%);
        }
    </style>
</head>
<body class="bg-[hsl(212,45%,89%)] flex flex-col items-center justify-center min-h-screen px-4 py-6">
    <main class="bg-white rounded-[20px] p-4 flex flex-col items-center gap-6 w-full max-w-[320px] shadow-sm">
        <img src="./images/image-qr-code.png"alt="QR Code to visit Frontend Mentor"class="w-full rounded-xl">
        <div class="flex flex-col items-center gap-4 px-2 pb-6">
            <h1 class="text-[22px] font-bold text-[hsl(218,44%,22%)] text-center leading-tight">
                Improve your front-end skills by building projects
            </h1>
            <p class="text-[15px] font-normal text-[hsl(216,15%,48%)] text-center leading-relaxed">
                Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
            </p>
        </div>
    </main>
    <!-- Attribution -->
    <footer class="attribution mt-6">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">
            Frontend Mentor
        </a>.
        Coded by <a href="https://www.frontendmentor.io/profile/Sharan-0305">Sharan-0305</a>.
    </footer>

</body>
</html>
